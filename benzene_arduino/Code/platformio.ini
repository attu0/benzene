[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
build_flags = -Wall -Os
; upload_port = /dev/ttyACM0

; Bisect build: same firmware, but NO motor pin is ever driven.
;   pio run -e uno_encoders_only -t upload
[env:uno_encoders_only]
extends = env:uno
build_flags = ${env:uno.build_flags} -DNO_MOTORS