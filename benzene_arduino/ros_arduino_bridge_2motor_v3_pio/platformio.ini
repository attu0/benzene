; ROS Arduino Bridge - 2 Motor V4 (Arduino Nano, ATmega328P)
; Serial protocol follows joshnewans/ros_arduino_bridge.

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 57600      ; must match BAUDRATE in include/config.h
monitor_eol = CR           ; the bridge only treats CR (\r) as end-of-command

; If upload fails with "not in sync", your Nano has the new bootloader.
; Change the board line above to:  board = nanoatmega328new