# Real-robot overrides for Nav2 + SLAM Toolbox (benzene).
#
# benzene_real_navigation.launch.py loads benzene_nav2_default_params.yaml (your
# sim parameters) and merges this file on top, so only what differs on the real
# robot lives here.
#   - nested dictionaries are merged key by key
#   - lists and scalars replace the base value
#   - a dictionary containing `__replace__: true` replaces the base one
#
# The odometry topic (bt_navigator / controller_server / velocity_smoother) is NOT
# set here: it comes from the launch argument `odom_topic`
# (default /diff_drive_controller/odom; the sim file points at /odometry/filtered,
# which does not exist on the real robot until an EKF publishes it).
#
# Values marked CHECK are guesses: tune them on the robot.

slam_toolbox:
  ros__parameters:
    max_laser_range: 10.0            # RPLIDAR A1 reaches about 12 m; far readings are noisy
    minimum_travel_distance: 0.2     # sim used 0.5
    minimum_travel_heading: 0.2      # sim used 0.5
    transform_timeout: 0.5           # TF comes from the Pi over Wi-Fi (sim used 0.2)

amcl:
  ros__parameters:
    laser_max_range: 12.0
    set_initial_pose: false          # give the start pose with RViz "2D Pose Estimate"
    always_reset_initial_pose: false

bt_navigator:
  ros__parameters:
    transform_tolerance: 0.5

controller_server:
  ros__parameters:
    FollowPath:                      # MPPI, merged into your sim tuning
      vx_max: 0.3                    # CHECK: sim 0.5. Raise once low-speed motion is reliable
      wz_max: 1.5                    # CHECK: sim 1.9
      transform_tolerance: 0.5       # sim 0.1; TF over Wi-Fi

    # Lighter alternative if the laptop struggles: regulated pure pursuit.
    # Replace the FollowPath block above with this one.
    # FollowPath:
    #   __replace__: true
    #   plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    #   desired_linear_vel: 0.3
    #   lookahead_dist: 0.6
    #   min_lookahead_dist: 0.3
    #   max_lookahead_dist: 0.9
    #   lookahead_time: 1.5
    #   transform_tolerance: 0.5
    #   min_approach_linear_velocity: 0.12
    #   approach_velocity_scaling_dist: 0.6
    #   use_collision_detection: true
    #   use_regulated_linear_velocity_scaling: true
    #   regulated_linear_scaling_min_radius: 0.9
    #   regulated_linear_scaling_min_speed: 0.15
    #   use_rotate_to_heading: true
    #   rotate_to_heading_angular_vel: 1.5
    #   max_angular_accel: 3.2
    #   allow_reversing: false

velocity_smoother:
  ros__parameters:
    max_velocity: [0.3, 0.0, 1.5]
    min_velocity: [-0.3, 0.0, -1.5]
    max_accel: [1.0, 0.0, 2.0]       # sim 2.5 / 3.2; match diff_drive_controller limits
    max_decel: [-1.0, 0.0, -2.0]

collision_monitor:
  ros__parameters:
    transform_tolerance: 0.5

behavior_server:
  ros__parameters:
    transform_tolerance: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 0.5